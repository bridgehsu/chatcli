# 给大模型意图分类使用的业务词典。
# 新增 IntentKind 后，请同步新增一项；程序启动时会校验名称是否完整且正确。
intents:
  - name: new_session
    action: session.create
    description: 创建一个新的 Telegram Agent 会话流程，不会关闭已有 CLI 终端。
    examples: ["新建会话", "开始一个新会话"]
  - name: close_session
    action: session.close
    description: 关闭当前 Telegram Agent 会话。
    examples: ["关闭会话", "结束当前会话"]
  - name: list_session
    action: session.list
    description: 查看当前聊天中的 Agent 会话列表。
    examples: ["会话列表", "获取会话列表"]
  - name: switch_session
    action: session.switch
    description: 查看并准备切换到另一个 Agent 会话。
    examples: ["切换会话", "我要换一个会话"]
  - name: switch_agent_session
    action: session.switch_id
    description: 按指定 Agent 会话 ID 切换会话。
    examples: ["/agent_session agent-123"]
  - name: choose_cli
    action: cli.choose
    description: 选择要启动的 CLI；必须在 cli 字段中返回 codex 或 cursor。
    examples: ["用 Codex", "打开 Cursor"]
  - name: open_terminal
    action: terminal.open
    description: 在当前 Agent 会话中创建普通 Shell tmux 终端，并在 macOS Terminal.app 中打开它。
    examples: ["打开终端", "开启终端"]
  - name: select_workspace
    action: workspace.select
    description: 请求选择一个工作目录。
    examples: ["选择目录", "我要选项目目录"]
  - name: list_directories
    action: workspace.list
    description: 列出可用工作目录或当前目录下的目录。
    examples: ["当前有哪些目录", "列出目录"]
  - name: close_terminal
    action: terminal.close
    description: 关闭当前运行中的 CLI 终端。
    examples: ["关闭终端", "结束终端"]
  - name: list_terminal
    action: terminal.list
    description: 查看当前 Agent 会话下的全部 tmux 终端。
    examples: ["终端列表", "查看终端"]
  - name: switch_terminal
    action: terminal.switch
    description: 查看并准备切换当前 Agent 会话下的 tmux 终端。
    examples: ["切换终端", "我要换一个终端"]
  - name: switch_terminal_id
    action: terminal.switch_id
    description: 按终端 ID 切换当前 Agent 会话下的 tmux 终端。
    examples: ["/terminal shell-123"]
  - name: unknown
    action: system.unknown
    description: 用户需求与现有功能无关，或无法可靠判断。
    examples: ["帮我写一首诗", "天气怎么样"]
  - name: agent_chat
    action: agent.chat
    description: 用户希望直接与 ChatCLI Agent 对话，不执行终端或会话控制操作。
    examples: ["解释一下 Rust 的 Arc", "你觉得下一步怎么做"]
  - name: cancel
    action: workspace.cancel
    description: 取消当前工作目录选择流程。
    examples: ["取消", "不选了"]
  - name: help
    action: system.help
    description: 说明当前可用操作或正在等待的输入。
    examples: ["帮助", "怎么用"]
  - name: reset
    action: session.reset
    description: 清空当前 Telegram 聊天的 Agent 会话、上下文和受管理终端，并回到全新初始会话。
    examples: ["/reset", "重置流程"]
  - name: self_introduction
    action: agent.introduce
    description: 询问 ChatCLI 是谁、能做什么或要求自我介绍。
    examples: ["自我介绍", "你是谁", "你能做什么"]
  - name: shell_confirm
    action: shell.confirm
    description: 确认执行当前等待授权的 Shell 命令。
    examples: ["确认", "执行"]
  - name: shell_cancel
    action: shell.cancel
    description: 放弃当前等待授权的 Shell 命令。
    examples: ["取消", "不执行"]
  - name: shell_edit
    action: shell.edit
    description: 修改当前等待确认的 Shell 候选命令，修改后仍需再次确认。
    examples: ["修改为：ls -lah", "修改：pwd"]
  - name: shell_waiting_confirmation
    action: shell.waiting_confirmation
    description: 提醒用户确认或取消当前等待授权的 Shell 命令。
    examples: ["换一条命令", "先不要"]
