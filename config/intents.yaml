# 给大模型意图分类使用的业务词典。
# 新增 IntentKind 后，请同步新增一项；程序启动时会校验名称是否完整且正确。
intents:
  - name: new_session
    action: manager.new
    description: 创建一个新的 Telegram Agent 会话流程，不会关闭已有 CLI 终端。
    examples: ["新建会话", "开始一个新会话"]
  - name: close_session
    action: manager.close
    description: 关闭当前 Telegram Agent 会话。
    examples: ["关闭会话", "结束当前会话"]
  - name: list_session
    action: manager.list
    description: 查看当前聊天中的 Agent 会话列表。
    examples: ["会话列表", "获取会话列表"]
  - name: switch_session
    action: manager.switch
    description: 查看并准备切换到另一个 Agent 会话。
    examples: ["切换会话", "我要换一个会话"]
  - name: switch_agent_session
    action: manager.switch_id
    description: 按指定 Agent 会话 ID 切换会话。
    examples: ["/agent_session agent-123"]
  - name: choose_cli
    action: cli.choose
    description: 选择要启动的 CLI；必须在 cli 字段中返回 codex 或 cursor。
    examples: ["用 Codex", "打开 Cursor"]
  - name: open_terminal
    action: cli.offer
    description: 打开终端入口并提示用户选择 CodeX 或 Cursor。
    examples: ["打开终端", "开启终端"]
  - name: select_workspace
    action: workspace.select
    description: 请求选择一个工作目录。
    examples: ["选择目录", "我要选项目目录"]
  - name: list_directories
    action: workspace.list
    description: 列出可用工作目录或当前目录下的目录。
    examples: ["当前有哪些目录", "列出目录"]
  - name: close_terminal
    action: terminal.close
    description: 关闭当前运行中的 CLI 终端。
    examples: ["关闭终端", "结束终端"]
  - name: unknown
    action: system.unknown
    description: 用户需求与现有功能无关，或无法可靠判断。
    examples: ["帮我写一首诗", "天气怎么样"]
  - name: reset
    action: manager.reset
    description: 将 Telegram Agent 会话流程重置到初始状态，不关闭已有 CLI 终端。
    examples: ["/reset", "重置流程"]
  - name: self_introduction
    action: agent.introduce
    description: 询问 ChatCLI 是谁、能做什么或要求自我介绍。
    examples: ["自我介绍", "你是谁", "你能做什么"]
